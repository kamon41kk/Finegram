name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          sudo docker image prune --all --force || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache native
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('TMessagesProj/jni/**/CMakeLists.txt') }}
          restore-keys: cxx-${{ runner.os }}-

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Android SDK parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Check secrets
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Не заданы секреты TELEGRAM_API_ID / TELEGRAM_API_HASH / KEYSTORE_PASSWORD"
            exit 1
          fi

      - name: Keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "Используется сохранённый ключ подписи"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 \
              -alias finegram -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Finegram MD3"
            mkdir -p keystore-out
            base64 -w0 "$RUNNER_TEMP/release.jks" > keystore-out/KEYSTORE_BASE64.txt
            echo "Создан новый ключ подписи, сохрани его из артефактов"
          fi

      - name: Upload new keystore
        if: hashFiles('keystore-out/KEYSTORE_BASE64.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: KEYSTORE-save-and-delete
          path: keystore-out/KEYSTORE_BASE64.txt
          retention-days: 1

      - name: private.properties
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          {
            echo "TELEGRAM_API_ID=$API_ID"
            echo "TELEGRAM_API_HASH=$API_HASH"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$KS_PASS"
            echo "KEY_ALIAS=finegram"
            echo "KEY_PASSWORD=$KS_PASS"
          } > private.properties

      - name: MD3 patch
        run: |
          sed -i 's/\r$//' md3_patch.py
          python3 md3_patch.py

      - name: Build
        run: |
          sed -i 's/\r$//' gradlew
          find . -name "*.sh" -not -path "./.git/*" -exec sed -i 's/\r$//' {} +
          chmod +x gradlew
          bash ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Finegram-APK
          path: TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/*.apk
          retention-days: 14
